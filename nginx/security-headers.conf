# Cabeceras de seguridad. Se incluye en cada location que define add_header,
# porque en Nginx un add_header dentro de location anula los heredados del server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS conviene activarlo en Cloudflare (SSL/TLS > Edge Certificates), donde termina el HTTPS.
