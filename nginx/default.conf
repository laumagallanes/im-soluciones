# Sitio estático de IM Soluciones.
# Escucha HTTP plano en el puerto 80 del contenedor: el HTTPS lo termina Cloudflare
# (y/o Traefik de Dokploy). No se publica ningún puerto en el host.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # Detrás de proxies: redirecciones relativas para no filtrar http:// ni el puerto interno.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json
               image/svg+xml text/xml application/xml text/plain image/x-icon;

    include /etc/nginx/snippets/security-headers.conf;

    # Healthcheck para Docker/Dokploy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML y config de contacto: siempre revalidar para que los cambios se vean enseguida.
    location ~* (\.html|/js/config\.js)$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:png|jpe?g|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page 404 /404.html;
}
